<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Crono Piragüismo</title>
<style>
:root{
  /* Layout: barra de tiempo fija arriba. Preparación = ajustes, luego bandeja de fotos junto a la parrilla de 4 columnas.
     Control = parrilla de llegadas junto a la tabla de resultados ordenada en vivo. */
  --bg:#EDF2F4; --surface:#FFFFFF; --surface2:#E3EBEF; --ink:#0F2533; --muted:#556B7A; --line:#C9D6DD;
  --accent:#0A6C80; --accent-ink:#FFFFFF;
  --go:#1B7A49; --go-ink:#FFFFFF; --stop:#B3261E; --stop-ink:#FFFFFF;
  --win:#FFF1C9;
  --bar:#0F2533; --bar-ink:#F1F7F9;
  --ov:rgba(10,28,40,.76); --ov-ink:#FFFFFF; --ov-in:rgba(150,28,22,.84);
  --warn:#F2B705; --warn-ink:#2B2100;
  --font-display:'Barlow Condensed','Arial Narrow','sans-serif-condensed',sans-serif;
  --font-body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08141C; --surface:#0F2430; --surface2:#17313F; --ink:#E3EEF2; --muted:#8CA5B3; --line:#23414F;
    --accent:#45C2D8; --accent-ink:#04212A;
    --go:#3FB67C; --go-ink:#04210F; --stop:#F0746B; --stop-ink:#2A0705;
    --win:#2F2A10;
    --bar:#05101A; --bar-ink:#E9F3F6;
    --ov:rgba(3,10,15,.78); --ov-in:rgba(125,24,20,.88);
    --warn:#F5C84B; --warn-ink:#2B2100;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08141C; --surface:#0F2430; --surface2:#17313F; --ink:#E3EEF2; --muted:#8CA5B3; --line:#23414F;
  --accent:#45C2D8; --accent-ink:#04212A;
  --go:#3FB67C; --go-ink:#04210F; --stop:#F0746B; --stop-ink:#2A0705;
  --win:#2F2A10;
  --bar:#05101A; --bar-ink:#E9F3F6;
  --ov:rgba(3,10,15,.78); --ov-in:rgba(125,24,20,.88);
  --warn:#F5C84B; --warn-ink:#2B2100;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--font-body); font-size:15px; line-height:1.4;
  padding-block:20px 48px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-text-size-adjust:100%;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
h2{font-family:var(--font-display);font-weight:600;font-size:22px;line-height:1.1;margin:0;letter-spacing:.01em}
p{margin:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Barra superior */
.top{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:11;
  background:var(--bar);color:var(--bar-ink);border-radius:6px;
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 14px;
  border:1px solid var(--line);
}
.brand,.clockbox{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
.brand-name{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1;letter-spacing:.01em}
.sub{font-size:13px;opacity:.78}
.clock{font-family:var(--font-display);font-weight:700;font-size:clamp(40px,11vw,58px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-left:auto}
.pill{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid currentColor;opacity:.9;font-variant-numeric:tabular-nums;white-space:nowrap}

/* Botones */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:44px;padding:8px 16px;border-radius:6px;border:1px solid var(--accent);
  background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none;
}
.btn.go{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.btn.stop{background:var(--stop);border-color:var(--stop);color:var(--stop-ink)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.small{min-height:36px;padding:4px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.warn{border-color:var(--stop);color:var(--stop);background:transparent}
.top .btn.ghost{color:var(--bar-ink);border-color:rgba(255,255,255,.4)}
/* Botones en 3D: brillo arriba, canto oscuro abajo y se hunden al pulsar */
.btn,.chip{
  position:relative;cursor:pointer;
  background-image:linear-gradient(180deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.06) 48%,rgba(0,0,0,.10) 100%);
  box-shadow:0 4px 0 rgba(0,0,0,.32),0 6px 10px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.35);
  transform:translateY(0);transition:transform .06s ease,box-shadow .06s ease;
  margin-bottom:4px;-webkit-tap-highlight-color:transparent;
}
.btn.ghost,.btn.warn,.chip{background-color:var(--surface);box-shadow:0 4px 0 var(--line),0 6px 10px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.6)}
.chip[aria-pressed="true"]{box-shadow:0 4px 0 rgba(0,0,0,.32),0 6px 10px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.35)}
.top .btn.ghost{background-color:transparent;box-shadow:0 4px 0 rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2)}
.btn:active:not(:disabled),.chip:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.32),0 2px 3px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.ghost:active:not(:disabled),.btn.warn:active,.chip:not([aria-pressed="true"]):active{box-shadow:0 1px 0 var(--line),0 2px 3px rgba(0,0,0,.12)}
.btn:disabled{box-shadow:0 2px 0 rgba(0,0,0,.15)}
@media (prefers-reduced-motion:reduce){.btn,.chip{transition:none}}

/* Paneles */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.panel-head h2{margin-right:auto}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{font-size:14px;color:var(--muted);max-width:62ch}
.cols{display:grid;gap:16px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:880px){
  .cols.prep{grid-template-columns:minmax(0,1fr) minmax(0,480px)}
  .cols.race{grid-template-columns:minmax(0,480px) minmax(0,1fr)}
}

/* Ajustes */
.settings{display:flex;flex-wrap:wrap;gap:14px 28px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.lbl{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:42px;padding:6px 13px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
select,input[type=date],input[type=number]{
  font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;min-height:42px;padding:6px 10px;
}
input[type=number]{width:90px}
.unit{color:var(--muted);font-size:14px}

/* Fotos */
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.vh:focus-visible + label.btn{outline:3px solid var(--accent);outline-offset:2px}
.pool{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;min-height:120px;padding:8px;border:1px dashed var(--line);border-radius:6px;background:var(--surface2)}
.pool.over,.slot.over{outline:3px solid var(--accent);outline-offset:-2px}
.empty-note{grid-column:1/-1;align-self:center;text-align:center;color:var(--muted);font-size:14px;padding:12px}

.tile{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;min-width:0;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tile[draggable="true"]{cursor:grab}
.tile.dragging{opacity:.4}
.ph{position:relative;aspect-ratio:4/5;background:var(--surface2);max-width:100%}
.ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 25%;pointer-events:none}
.badge{position:absolute;left:4px;top:4px;background:var(--bar);color:var(--bar-ink);font-size:11px;font-weight:600;line-height:1;padding:4px 6px;border-radius:4px;font-variant-numeric:tabular-nums;white-space:nowrap}
.x{position:absolute;right:3px;top:3px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ov);color:var(--ov-ink);font-size:16px;line-height:1;padding:0}
.x.confirm{width:auto;height:26px;border-radius:13px;padding:0 9px;background:var(--stop);color:var(--stop-ink);font-size:12px;font-weight:600}
.notice{font-size:13px;color:var(--stop);font-weight:500}
.cap{display:flex;align-items:center;justify-content:center;gap:2px;padding:3px 3px 4px;min-height:30px;font-size:12px;font-weight:500;min-width:0}
.cap span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ed{flex:none;width:24px;height:24px;border:0;background:transparent;color:var(--muted);padding:0;font-size:14px}
.rename{width:100%;min-width:0;min-height:26px;font:inherit;font-size:12px;padding:2px 4px;border:1px solid var(--accent);border-radius:4px;background:var(--surface);color:var(--ink)}
.tile-sel,.sel > .tile,.tile.sel{outline:3px solid var(--accent);outline-offset:-1px}

/* Parrilla */
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.slot{min-width:0;border-radius:6px}
.slot.empty{min-height:104px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:22px;background:transparent}
.slot.sel{outline:3px solid var(--accent);outline-offset:1px}
.selbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 10px;border-radius:6px;background:var(--surface2);font-size:14px}
.selbar .grow{margin-right:auto}
.row-actions{display:flex;flex-wrap:wrap;gap:8px}

/* Llegadas */
.arr{touch-action:manipulation}
.arr[data-act="arrive"]{cursor:pointer;border-color:var(--accent);border-width:2px}
.arr[data-act="arrive"]:active{transform:scale(.97)}
.arr.locked{opacity:.55}
.ov{position:absolute;inset:0;background:var(--ov);color:var(--ov-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ov b{font-family:var(--font-display);font-size:30px;line-height:1;font-weight:700}
.ov small{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
/* Estado de salida: verde = le toca salir, amarillo = en ruta, rojo = en meta */
.st{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;text-align:center;padding:3px 2px;background:var(--surface2);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.arr.st-go{--c:var(--go)}
.tile.arr.st-out{--c:var(--warn)}
.tile.arr.st-in{--c:var(--stop)}
.tile.arr.st-go,.tile.arr.st-out,.tile.arr.st-in{border-color:var(--c);box-shadow:0 0 0 3px var(--c)}
.st-go .st{background:var(--go);color:var(--go-ink)}
.st-out .st{background:var(--warn);color:var(--warn-ink)}
.st-in .st{background:var(--stop);color:var(--stop-ink)}
.arrived .st{text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block}
.dot.go{background:var(--go)}.dot.out{background:var(--warn)}.dot.in{background:var(--stop)}
.flash{animation:flash .9s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}.arr[data-act="arrive"]:active{transform:none}}

/* Tabla */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table.res{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}
.res th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding:8px 8px;background:var(--surface2);white-space:nowrap}
.res td{padding:7px 8px;border-top:1px solid var(--line);white-space:nowrap}
.res .num{text-align:right}
.res tr.win td{background:var(--win)}
.res tr.flash td{animation:rowflash .9s ease-out}
@keyframes rowflash{0%{background:var(--accent);color:var(--accent-ink)}100%{}}
@media (prefers-reduced-motion:reduce){.res tr.flash td{animation:none}}
.pos{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:1}
.who{display:flex;align-items:center;gap:8px;min-width:0}
.who img{width:28px;height:34px;object-fit:cover;object-position:50% 25%;border-radius:3px;flex:none}
.who .nm{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.who .nm b{font-weight:600;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.who .nm small{color:var(--muted);font-size:11px}
.time{font-weight:700;font-size:15px}
.diff{color:var(--muted)}
.flagged{color:var(--stop);font-size:11px;font-weight:600}
.del{width:28px;height:28px;border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:0;border-radius:4px}
.copybox{width:100%;min-height:120px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--surface2);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.foot{font-size:12px;color:var(--muted)}

.btn.blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{0%{background:var(--stop);color:var(--stop-ink);box-shadow:0 0 0 4px var(--warn)}50%{background:var(--warn);color:var(--warn-ink);border-color:var(--warn);box-shadow:0 0 0 4px var(--stop)}}
@media (prefers-reduced-motion:reduce){.btn.blink{animation-duration:2s}}
.countdown{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:35;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 34px;border-radius:16px;background:rgba(15,37,51,.82);color:#fff;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.countdown b{font-family:var(--font-display);font-size:min(46vw,190px);line-height:.9;font-weight:700;font-variant-numeric:tabular-nums}
.countdown span{font-size:18px;font-weight:600;max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.countdown.go{background:rgba(27,122,73,.92)}
.countdown.go b{font-size:min(26vw,110px)}
.tappable{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
/* Ventanas (nombre, elegir fotos, temporada) */
.modal{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:600px){.modal{align-items:center}}
.backdrop{position:absolute;inset:0;background:rgba(5,15,22,.55)}
.sheet{position:relative;background:var(--surface);color:var(--ink);border-radius:10px 10px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px){.sheet{border-radius:10px}}
.sheet.wide{max-width:980px}
.sheet .tablewrap{max-height:none}
.res .ctl{text-align:center;font-size:11px;line-height:1.2;white-space:nowrap}
.res .ctl button{border:0;background:transparent;color:var(--accent);font:inherit;font-weight:700;padding:2px;text-decoration:underline}
.res td.cell{text-align:center;line-height:1.15}
.res td.cell b{display:block;font-family:var(--font-display);font-size:18px}
.res td.cell small{color:var(--muted);font-size:11px}
.res td.cell.p1 b{color:var(--go)}
.res td.none{text-align:center;color:var(--muted)}
.res .sticky{position:sticky;left:0;background:var(--surface);z-index:1}
.res th.sticky{background:var(--surface2)}
.res tr.win td.sticky{background:var(--win)}
.res .sticky:first-child{width:34px;min-width:34px;max-width:34px;box-sizing:border-box}
.ctl-list{display:flex;flex-wrap:wrap;gap:6px}
.sheet h3{margin:0;font-size:18px}
.txt{font:inherit;font-size:17px;color:var(--ink);background:var(--surface);border:1px solid var(--accent);border-radius:6px;min-height:46px;padding:6px 10px;width:100%;box-sizing:border-box}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.pickgrid .tile{cursor:pointer}
.pickgrid .tile.placed{opacity:.6}
.pickgrid .tile.sel{opacity:1}
.season{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;font-size:14px}
.season b{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--bar);color:var(--bar-ink);padding:10px 16px;border-radius:6px;font-size:14px;max-width:calc(100% - 32px);border:1px solid var(--line)}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="countdown" id="countdown" aria-live="assertive" hidden><b id="cdNum"></b><span id="cdName"></span></div>

<script src="xlsx.mini.min.js"></script>
<script>
(function(){
'use strict';

const KEY='crono-piraguismo-v1';
const DISTANCES=[200,500,1000,1500,3000];
const PRESETS=[30,60,15,45,90,120];

const $=s=>document.querySelector(s);
const app=$('#app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtDay(s){const p=String(s||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0].slice(2):s;}
function fmtDayLong(s){const p=String(s||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:s;}
function fmt(ms){
  const neg=ms<0; ms=Math.abs(ms);
  const cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000)%60, m=Math.floor(ms/60000);
  return (neg?'−':'')+m+':'+pad(s)+'.'+pad(cs);
}
function fmtOff(sec){return Math.floor(sec/60)+':'+pad(sec%60);}
function lab(sec){
  if(sec<60) return sec+'″';
  const m=Math.floor(sec/60), s=sec%60;
  return m+'′'+(s?s+'″':'');
}

function fresh(){
  return {photos:[],slots:[],mode:'individual',interval:30,distance:500,day:today(),
    phase:'prep',startAt:null,stoppedAt:null,order:[],runInterval:0,results:[]};
}
function load(){
  try{
    const raw=localStorage.getItem(KEY); if(!raw) return null;
    const s=JSON.parse(raw);
    if(!s||!Array.isArray(s.photos)||!Array.isArray(s.slots)||!Array.isArray(s.results)||!Array.isArray(s.order)) return null;
    const f=fresh(); for(const k in f){ if(s[k]===undefined) s[k]=f[k]; }
    if(s.phase==='prep') s.day=today();
    return s;
  }catch(e){return null;}
}
/* Las fotos viven en la biblioteca (store); aquí solo se guarda el estado del control */
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(Object.assign({},S,{photos:[]}))); }catch(e){} }

let S=load()||fresh();
const ui={sel:null,editing:null,confirm:null,flash:null,customInterval:false,copyText:null,modal:null,saving:false};
let raf=0, toastT=0, down=null, ordN=0, lastG=-2;

/* Estados de la parrilla de llegadas durante el control */
const ST_TEXT={go:'Siguiente',out:'En ruta',idle:'Espera','in':'En meta'};
function stateFor(rank,elapsed){
  const iv=S.runInterval*1000;
  if(!iv) return 'out';
  const g=Math.floor(elapsed/iv); /* g = último en salir; el 0 sale al pulsar Iniciar */
  return rank<=g?'out':(rank===g+1?'go':'idle');
}
function applyStates(elapsed){
  const iv=S.runInterval*1000, g=iv?Math.floor(elapsed/iv):-1;
  if(g===lastG) return;
  lastG=g;
  document.querySelectorAll('.arr[data-rank]').forEach(t=>{
    if(t.classList.contains('arrived')) return;
    const s=stateFor(+t.dataset.rank,elapsed);
    t.classList.remove('st-go','st-out','st-idle'); t.classList.add('st-'+s);
    const el=t.querySelector('.st'); if(el) el.textContent=ST_TEXT[s];
  });
}
function nextInfo(elapsed){
  const iv=S.runInterval*1000, n=S.order.length;
  if(!iv) return 'Salida conjunta: todos en ruta';
  const g=Math.floor(elapsed/iv);
  if(g>=n-1) return 'Todos han salido';
  const p=P(S.order[g+1]);
  return 'Siguiente: '+(p?p.name:'')+' · sale en '+lab(Math.ceil((iv-(elapsed%iv))/1000));

/* Biblioteca de fotos: IndexedDB; si no está disponible, localStorage; si tampoco, solo memoria */
const store=(()=>{
  const LSK='crono-piraguismo-photos'; let db=null, mode='mem';
  const done=tx=>new Promise((res,rej)=>{tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});
  const lsAll=()=>{try{return JSON.parse(localStorage.getItem(LSK)||'[]');}catch(e){return [];}};
  return {
    get mode(){return mode;},
    async init(){
      try{
        if(!window.indexedDB) throw new Error('noidb');
        db=await new Promise((res,rej)=>{
          const r=indexedDB.open('crono-piraguismo',1);
          r.onupgradeneeded=()=>r.result.createObjectStore('photos',{keyPath:'id'});
          r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error('blocked'));
        });
        mode='idb';
      }catch(e){
        db=null;
        try{ localStorage.getItem(LSK); mode='ls'; }catch(e2){ mode='mem'; }
      }
    },
    async all(){
      if(mode==='idb') return new Promise((res,rej)=>{const r=db.transaction('photos').objectStore('photos').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
      if(mode==='ls') return lsAll();
      return [];
    },
    async put(rec){
      if(mode==='idb'){const tx=db.transaction('photos','readwrite');tx.objectStore('photos').put(rec);return done(tx);}
      if(mode==='ls'){const a=lsAll();const i=a.findIndex(x=>x.id===rec.id);if(i>=0)a[i]=rec;else a.push(rec);localStorage.setItem(LSK,JSON.stringify(a));return;}
      throw new Error('mem');
    },
    async del(id){
      if(mode==='idb'){const tx=db.transaction('photos','readwrite');tx.objectStore('photos').delete(id);return done(tx);}
      if(mode==='ls'){localStorage.setItem(LSK,JSON.stringify(lsAll().filter(x=>x.id!==id)));}
    },
    async clear(){
      if(mode==='idb'){const tx=db.transaction('photos','readwrite');tx.objectStore('photos').clear();return done(tx);}
      if(mode==='ls'){localStorage.removeItem(LSK);}
    }
  };
})();

/* ---------- Parrilla ---------- */
function ensureSlots(){
  const ids=new Set(S.photos.map(p=>p.id));
  S.slots=S.slots.map(id=>ids.has(id)?id:null);
  const n=Math.max(4,Math.ceil(S.photos.length/4)*4);
  if(S.slots.length>n){
    const f=S.slots.filter(Boolean);
    S.slots=f.concat(new Array(Math.max(0,n-f.length)).fill(null));
  }
  while(S.slots.length<n) S.slots.push(null);
}
function rankMap(){const m={};let r=0;S.slots.forEach(id=>{if(id){m[id]=r++;}});return m;}
function place(id,i){
  if(!P(id)) return;
  const j=S.slots.indexOf(id), other=S.slots[i];
  if(other===id) return;
  if(j>=0) S.slots[j]=other||null;
  S.slots[i]=id;
}
function unplace(id){const j=S.slots.indexOf(id);if(j>=0)S.slots[j]=null;}

/* ---------- Fotos ---------- */
function nameFromFile(f){
  let n=f.name.replace(/\.[^.]+$/,'').replace(/[_\-]+/g,' ').replace(/\s+/g,' ').trim();
  return n||'Palista';
}
function loadThumb(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      const max=240, k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const w=Math.max(1,Math.round(img.naturalWidth*k)), h=Math.max(1,Math.round(img.naturalHeight*k));
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',0.78));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('img'));};
    img.src=url;
  });
}
async function addFiles(list){
  if(S.phase!=='prep') return;
  const imgs=[...list].filter(f=>f.type?f.type.startsWith('image/'):/\.(jpe?g|png|gif|webp|bmp|heic|heif)$/i.test(f.name||''))
    .sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  if(!imgs.length){toast('No se ha encontrado ninguna imagen');return;}
  const known=new Set(S.photos.map(p=>p.sig).filter(Boolean));
  const files=[]; let dup=0;
  for(const f of imgs){
    const sig=f.name+'|'+f.size+'|'+f.lastModified;
    if(known.has(sig)){dup++;continue;}
    known.add(sig); files.push({f,sig});
  }
  if(!files.length){toast('Esas fotos ya estaban cargadas');return;}
  toast('Cargando '+files.length+(files.length===1?' foto…':' fotos…'));
  let ok=0, unsaved=0;
  for(const x of files){
    try{
      const thumb=await loadThumb(x.f);
      const rec={id:uid(),name:nameFromFile(x.f),thumb,sig:x.sig,ord:++ordN};
      try{ await store.put(rec); }catch(e){ unsaved++; }
      S.photos.push(rec); ok++;
    }catch(e){}
  }
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}
  save(); render();
  let msg=ok+(ok===1?' foto guardada':' fotos guardadas');
  if(dup) msg+=' · '+dup+(dup===1?' ya estaba':' ya estaban');
  if(unsaved) msg=ok+' cargadas, pero '+unsaved+' no se pudieron guardar en este navegador';
  toast(msg);
}

function placeChosen(i,ids){
  ids=ids.filter(id=>P(id)); if(!ids.length) return;
  ids.forEach(unplace);
  const order=[i];
  for(let j=i+1;j<S.slots.length;j++) order.push(j);
  for(let j=0;j<i;j++) order.push(j);
  const free=order.filter(j=>!S.slots[j]);
  ids.forEach((id,k)=>{ if(k<free.length) S.slots[free[k]]=id; else S.slots.push(id); });
  ensureSlots();
}

/* ---------- Temporadas y hoja de cálculo ---------- */
const SEASON_KEY='crono-temporada';
function getSeason(){ try{ return localStorage.getItem(SEASON_KEY)||''; }catch(e){ return ''; } }
function setSeason(v){ try{ localStorage.setItem(SEASON_KEY,v); }catch(e){} }
function cleanSeason(v){ return String(v||'').trim().replace(/[^0-9A-Za-zÀ-ÿ_-]+/g,'-').replace(/^-+|-+$/g,'').slice(0,12); }
function suggestSeason(){
  const cur=getSeason();
  if(!cur) return String(new Date().getFullYear()).slice(2);
  return /^\d+$/.test(cur)?String(+cur+1).padStart(cur.length,'0'):cur;
}
const bridge=()=>window.CronosFiles||null;
function filesLocation(){ try{ return bridge()?bridge().location():'Descargas'; }catch(e){ return 'Descargas'; } }
function seasonLine(){
  const cur=getSeason();
  return '<span>'+(cur?'Archivo actual: <b>temporada'+esc(cur)+'.xlsx</b>':'Aún no hay temporada: se pedirá al guardar')+'</span>'+
    '<button class="btn small ghost" data-act="newSeason">Nueva temporada</button>'+
    '<button class="btn small ghost" data-act="viewLast"'+(cur?'':' disabled')+'>Ver último control</button>'+
    '<button class="btn small ghost" data-act="viewSummary"'+(cur?'':' disabled')+'>Ver resumen</button>';
}
function seasonOk(){
  const v=cleanSeason(($('#modalInput')||{}).value);
  if(!v){ toast('Escribe la temporada, por ejemplo 26'); return; }
  const then=ui.modal&&ui.modal.then;
  setSeason(v); ui.modal=null; render();
  if(then==='save') saveSheet();
  else toast('Temporada '+v+': los próximos resultados se guardarán en temporada'+v+'.xlsx');
}
function sheetDay(d){ const p=String(d||'').split('-'); return p.length===3?p[2]+'-'+p[1]+'-'+p[0]:String(d); }
function b64ToBytes(b){ const s=atob(b), a=new Uint8Array(s.length); for(let i=0;i<s.length;i++) a[i]=s.charCodeAt(i); return a; }
function readBook(name){
  let b='';
  try{ b=bridge()?bridge().read(name):(localStorage.getItem('crono-xlsx-'+name)||''); }catch(e){ b=''; }
  if(!b) return null;
  try{ return XLSX.read(b,{type:'base64'}); }catch(e){ return null; }
}
function writeBook(name,wb){
  const b=XLSX.write(wb,{type:'base64',bookType:'xlsx'});
  if(bridge()) return bridge().write(name,b);
  /* Sin la app (navegador): se guarda una copia aquí y se descarga el archivo */
  try{ localStorage.setItem('crono-xlsx-'+name,b); }catch(e){}
  const url=URL.createObjectURL(new Blob([b64ToBytes(b)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  return 'ok';
}
function resultRows(){
  const sorted=S.results.slice().sort((a,b)=>a.net-b.net);
  const head=S.distance+' m · '+fmtDayLong(S.day)+' · '+(S.runInterval>0?'salida individual cada '+lab(S.runInterval):'salida conjunta');
  const rows=[[head],['Pos','Palista','Tiempo','Dif.','Salió','Segundos']];
  sorted.forEach((r,i)=>rows.push([i+1,r.name,fmt(r.net),i===0?'':'+'+fmt(r.net-sorted[0].net),(r.rank+1)+'º',Math.round(r.net/10)/100]));
  return rows;
}
async function saveSheet(){
  if(!S.results.length) return;
  if(typeof XLSX==='undefined'){ toast('No se pudo cargar el generador de hojas de cálculo'); return; }
  const season=getSeason();
  if(!season){ ui.modal={type:'season',then:'save',focus:true}; render(); return; }
  const name='temporada'+season+'.xlsx', sheet=sheetDay(S.day);
  ui.saving=true; render();
  try{
    const wb=readBook(name)||XLSX.utils.book_new();
    const rows=resultRows();
    let ws=wb.Sheets[sheet], row=0;
    const blk=S.block&&S.block.file===name&&S.block.sheet===sheet?S.block:null;
    if(ws&&blk){
      /* Este mismo control ya se guardó: se sustituye su bloque por los tiempos corregidos */
      for(let r=blk.row;r<blk.row+blk.len;r++) for(let c=0;c<6;c++) delete ws[XLSX.utils.encode_cell({r,c})];
      XLSX.utils.sheet_add_aoa(ws,rows,{origin:{r:blk.row,c:0}});
      row=blk.row;
    }else if(ws){
      /* Otro control del mismo día: se añade debajo, dejando una fila en blanco */
      const end=ws['!ref']?XLSX.utils.decode_range(ws['!ref']).e.r:-2;
      row=end+2;
      XLSX.utils.sheet_add_aoa(ws,rows,{origin:{r:row,c:0}});
    }else{
      ws=XLSX.utils.aoa_to_sheet(rows);
      ws['!cols']=[{wch:5},{wch:24},{wch:10},{wch:10},{wch:7},{wch:9}];
      XLSX.utils.book_append_sheet(wb,ws,sheet);
    }
    const res=writeBook(name,wb);
    if(res==='ok'){ S.savedIn=name; S.block={file:name,sheet,row,len:Math.max(rows.length,blk?blk.len:0)}; save(); toast('Guardado en '+filesLocation()+'/'+name+' · hoja '+sheet); }
    else if(res==='perm') toast('Permite el acceso al almacenamiento y vuelve a pulsar Guardar');
    else toast('No se pudo guardar: '+String(res).replace(/^error:/,''));
  }catch(e){ toast('No se pudo guardar la hoja de cálculo'); }
  ui.saving=false; render();
}

/* ---------- Ver resultados guardados ---------- */
/* Lee todos los controles del archivo de la temporada actual. Cada control es un
   bloque: «500 m · dd/mm/aaaa · …», la fila de títulos y una fila por palista. */
function loadControls(){
  const season=getSeason(); if(!season) return null;
  const wb=readBook('temporada'+season+'.xlsx'); if(!wb) return [];
  const list=[]; let seq=0;
  wb.SheetNames.forEach(sn=>{
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:''});
    for(let i=0;i<rows.length;i++){
      const h=String(rows[i][0]||'').match(/^(\d+)\s*m\s*·\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s*·?\s*(.*)$/);
      if(!h||String((rows[i+1]||[])[0]).trim()!=='Pos') continue;
      const c={distance:+h[1],day:h[4]+'-'+pad(+h[3])+'-'+pad(+h[2]),mode:h[5]||'',sheet:sn,seq:seq++,results:[]};
      for(let j=i+2;j<rows.length;j++){
        const r=rows[j], pos=+r[0];
        if(!r[0]||!isFinite(pos)||!String(r[1]).trim()) break;
        const sec=typeof r[5]==='number'?r[5]:null;
        c.results.push({pos,name:String(r[1]).trim(),time:String(r[2]||''),diff:String(r[3]||''),start:String(r[4]||''),sec});
        i=j;
      }
      if(c.results.length) list.push(c);
    }
  });
  /* Del último al primer control */
  list.sort((a,b)=>a.day<b.day?1:a.day>b.day?-1:b.seq-a.seq);
  return list;
}
function openResults(type,idx){
  if(typeof XLSX==='undefined'){ toast('No se pudo cargar el lector de hojas de cálculo'); return; }
  const ctls=loadControls();
  if(ctls===null){ toast('Aún no hay temporada'); return; }
  if(!ctls.length){ toast('Todavía no hay controles guardados en temporada'+getSeason()+'.xlsx'); return; }
  ui.modal={type,idx:idx||0,ctls,dist:0}; render();
}
const keyName=n=>String(n).trim().toLowerCase().replace(/\s+/g,' ');
function ctlLabel(c){ return fmtDay(c.day)+' · '+c.distance+' m'; }
function ctlButtons(m){
  return '<div class="ctl-list">'+m.ctls.map((c,i)=>'<button class="chip" aria-pressed="'+(m.type==='control'&&m.idx===i)+'" data-act="viewCtl" data-i="'+i+'">'+esc(ctlLabel(c))+'</button>').join('')+'</div>';
}
function controlView(m){
  const c=m.ctls[m.idx]; if(!c) return '';
  const rows=c.results.map((r,i)=>'<tr class="'+(i===0?'win':'')+'"><td><span class="pos">'+r.pos+'</span></td><td>'+esc(r.name)+'</td><td class="num time">'+esc(r.time)+'</td><td class="num diff">'+esc(r.diff||'—')+'</td><td class="num">'+esc(r.start)+'</td></tr>').join('');
  return '<h3>'+(m.idx===0?'Último control':'Control')+' · '+esc(fmtDayLong(c.day))+' · '+c.distance+' m</h3>'+
    '<p class="hint">'+esc(c.mode)+(c.mode?' · ':'')+c.results.length+' palistas · temporada'+esc(getSeason())+'.xlsx, hoja '+esc(c.sheet)+'</p>'+
    '<div class="tablewrap"><table class="res"><thead><tr><th>Pos</th><th>Palista</th><th class="num">Tiempo</th><th class="num">Dif.</th><th class="num">Salió</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<span class="lbl">Otros controles (del último al primero)</span>'+ctlButtons(m)+
    '<div class="row-actions"><button class="btn" data-act="viewSummary">Ver resumen</button><button class="btn ghost" data-act="closeModal">Cerrar</button></div>';
}
/* Resumen: una columna por control (del último al primero) y una fila por palista,
   de mejor a peor según la media de sus puestos. Quien falta a un control cuenta
   como último + 1 en ese control, para no premiar ir a menos controles. */
function summaryRows(ctls){
  const people={};
  ctls.forEach((c,ci)=>c.results.forEach(r=>{
    const k=keyName(r.name);
    const p=people[k]||(people[k]={name:r.name,cells:{},sum:0,n:0,wins:0});
    p.cells[ci]=r; p.n++; if(r.pos===1) p.wins++;
  }));
  const list=Object.values(people);
  list.forEach(p=>{
    p.sum=0;
    ctls.forEach((c,ci)=>{ p.sum+=p.cells[ci]?p.cells[ci].pos:c.results.length+1; });
    p.avg=ctls.length?p.sum/ctls.length:0;
  });
  list.sort((a,b)=>a.sum-b.sum||b.n-a.n||b.wins-a.wins||a.name.localeCompare(b.name));
  return list;
}
function summaryView(m){
  const dists=[...new Set(m.ctls.map(c=>c.distance))].sort((a,b)=>a-b);
  const ctls=m.ctls.map((c,i)=>Object.assign({i},c)).filter(c=>!m.dist||c.distance===m.dist);
  const people=summaryRows(ctls);
  const chips='<div class="chips"><button class="chip" aria-pressed="'+(!m.dist)+'" data-act="viewDist" data-v="0">Todas</button>'+
    dists.map(d=>'<button class="chip" aria-pressed="'+(m.dist===d)+'" data-act="viewDist" data-v="'+d+'">'+d+' m</button>').join('')+'</div>';
  const head='<tr><th class="sticky">#</th><th class="sticky" style="left:34px">Palista</th><th class="num">Media</th>'+
    ctls.map(c=>'<th class="ctl"><button data-act="viewCtl" data-i="'+c.i+'">'+esc(fmtDay(c.day))+'<br>'+c.distance+' m</button></th>').join('')+'</tr>';
  const body=people.map((p,k)=>'<tr class="'+(k===0?'win':'')+'"><td class="sticky"><span class="pos">'+(k+1)+'</span></td><td class="sticky" style="left:34px"><b>'+esc(p.name)+'</b><br><small class="diff">'+p.n+' de '+ctls.length+' controles</small></td>'+
    '<td class="num">'+p.avg.toFixed(1).replace('.',',')+'</td>'+
    ctls.map((c,ci)=>{ const r=p.cells[ci]; return r?'<td class="cell'+(r.pos===1?' p1':'')+'"><b>'+r.pos+'º</b><small>'+esc(r.time)+'</small></td>':'<td class="none">—</td>'; }).join('')+'</tr>').join('');
  return '<h3>Resumen · temporada'+esc(getSeason())+'</h3>'+
    '<p class="hint">Palistas de mejor a peor según la media de sus puestos. Si alguien no estuvo en un control, cuenta como último + 1 en ese control. Los controles van del último al primero; toca uno para ver su tabla.</p>'+
    (dists.length>1?chips:'')+
    '<div class="tablewrap"><table class="res"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>'+
    '<div class="row-actions"><button class="btn" data-act="viewLast">Ver último control</button><button class="btn ghost" data-act="closeModal">Cerrar</button></div>';
}

/* ---------- Cuenta atrás y pitidos ---------- */
const SOUND_KEY='crono-sonido';
let soundOn=(()=>{ try{ return localStorage.getItem(SOUND_KEY)!=='0'; }catch(e){ return true; } })();
let actx=null, cdKey='', cdStartK=-1, cdGoUntil=0;
function audioUnlock(){
  try{
    if(!actx){ const C=window.AudioContext||window.webkitAudioContext; if(C) actx=new C(); }
    if(actx&&actx.state==='suspended') actx.resume();
  }catch(e){}
}
function beep(freq,dur,vol){
  if(!soundOn||!actx) return;
  try{
    const t0=actx.currentTime, o=actx.createOscillator(), g=actx.createGain();
    o.type='square'; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol,t0+0.01);
    g.gain.setValueAtTime(vol,t0+dur-0.03);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}
/* Los 5 últimos segundos antes de cada salida, desde el 2º palista: número grande y
   pitido corto cada segundo; al salir, pitido más agudo y algo más largo. */
function countdown(t){
  const box=$('#countdown'); if(!box) return;
  const iv=S.runInterval*1000, n=S.order.length;
  if(S.phase!=='running'||!iv){ box.hidden=true; return; }
  const g=Math.floor(t/iv), k=g+1;
  if(cdStartK<0) cdStartK=g; /* tras recargar la página no se repiten pitidos pasados */
  if(g>=1&&g<n&&g>cdStartK){
    cdStartK=g;
    if(t-g*iv<1000){ beep(1320,0.45,0.35); cdGoUntil=Date.now()+900; const p=P(S.order[g]); $('#cdNum').textContent='¡Sale!'; $('#cdName').textContent=p?p.name:''; box.classList.add('go'); box.hidden=false; }
  }
  if(Date.now()<cdGoUntil) return;
  const rem=k*iv-t;
  if(k<n&&rem<=5000&&rem>0){
    const sec=Math.ceil(rem/1000), key=k+':'+sec;
    if(key!==cdKey){
      cdKey=key; beep(880,0.12,0.3);
      const p=P(S.order[k]);
      $('#cdNum').textContent=sec; $('#cdName').textContent=p?p.name:'';
      box.classList.remove('go'); box.hidden=false;
    }
  }else box.hidden=true;
}

/* ---------- Reloj ---------- */
function tick(){
  const el=$('#clock');
  const t=S.phase==='running'?Date.now()-S.startAt:(S.phase==='done'?S.stoppedAt-S.startAt:0);
  if(el) el.textContent=fmt(t);
  if(S.phase!=='prep'){
    applyStates(t);
    countdown(t);
    const ni=$('#nextinfo');
    if(ni){ const s=S.phase==='running'?nextInfo(t):''; if(ni.textContent!==s) ni.textContent=s; }
  }
  if(S.phase==='running') raf=requestAnimationFrame(tick);
}

function render(){
  const y=window.scrollY;
  app.innerHTML=(S.phase==='prep'?prepView():runView())+modalView();
  window.scrollTo(0,y);
  cancelAnimationFrame(raf); lastG=-2; tick();
  ui.flash=null;
  if(ui.modal&&ui.modal.focus){ui.modal.focus=false; const i=$('#modalInput'); if(i){i.focus(); i.select();}}
}

/* ---------- Acciones ---------- */
function arrive(id,t){
  if(S.phase!=='running') return;
  if(S.results.some(r=>r.photoId===id)){toast('Ya está registrado');return;}
  const rank=S.order.indexOf(id); if(rank<0) return;
  const p=P(id);
  const elapsed=t-S.startAt;
  const net=elapsed-rank*S.runInterval*1000;
  S.results.push({id:uid(),photoId:id,name:p?p.name:'Palista',rank,elapsed,net,day:S.day});
  S.savedIn=null;
  ui.flash=id; save(); render();
  if(net<0) toast('Este palista aún no debería haber llegado: revisa la fila');
  else if(S.results.length>=S.order.length){ toast('Han llegado todos: pulsa Terminar'); try{ navigator.vibrate&&navigator.vibrate([200,100,200]); }catch(e){} }
}
function resultsText(){
  const sorted=S.results.slice().sort((a,b)=>a.net-b.net);
  const head=S.distance+' m · '+fmtDayLong(S.day)+' · '+(S.runInterval>0?'salida individual cada '+lab(S.runInterval):'salida conjunta');
  const lines=['Pos\tPalista\tDía\tTiempo\tDif.'];
  sorted.forEach((r,i)=>lines.push((i+1)+'\t'+r.name+'\t'+fmtDayLong(r.day)+'\t'+fmt(r.net)+'\t'+(i===0?'—':'+'+fmt(r.net-sorted[0].net))));
  return head+'\n'+lines.join('\n');
}
async function copyResults(){
  const txt=resultsText();
  try{ await navigator.clipboard.writeText(txt); ui.copyText=null; toast('Resultados copiados'); }
  catch(e){ ui.copyText=txt; render(); setTimeout(()=>{const b=$('#copyBox'); if(b){b.focus(); b.select();}},0); }
}
function askConfirm(key){
  if(ui.confirm===key) return true;
  ui.confirm=key; render();
  setTimeout(()=>{ if(ui.confirm===key){ui.confirm=null; render();} },4000);
  return false;
}
function saveRename(id,value){
  const p=P(id); ui.editing=null; ui.modal=null;
  if(p){ const v=String(value||'').trim(); if(v){ p.name=v; store.put(p).catch(()=>{}); } }
  save(); render();
}

function act(name,el,e){
  const id=el.dataset.id;
  switch(name){
    case 'dist': S.distance=+el.dataset.v; save(); render(); break;
    case 'mode': S.mode=el.dataset.v; save(); render(); break;
    case 'pick': ui.sel=(ui.sel===id)?null:id; render(); break;
    case 'slot': {
      const i=+el.dataset.i;
      if(ui.sel){ place(ui.sel,i); ui.sel=null; save(); }
      else if(S.slots[i]){ ui.sel=S.slots[i]; }
      else if(S.photos.length){ ui.modal={type:'pick',slot:i,chosen:[]}; }
      else { toast('Primero añade fotos a la biblioteca'); }
      render(); break;
    }
    case 'desel': ui.sel=null; render(); break;
    case 'toPool': if(ui.sel) unplace(ui.sel); ui.sel=null; save(); render(); break;
    case 'remove': {
      if(!askConfirm('rm:'+id)) break;
      unplace(id); S.photos=S.photos.filter(p=>p.id!==id);
      store.del(id).catch(()=>{});
      if(ui.sel===id) ui.sel=null;
      ui.confirm=null; save(); render(); break;
    }
    case 'rename': ui.sel=null; ui.modal={type:'rename',id,focus:true}; render(); break;
    case 'fillAll': {
      const free=S.photos.filter(p=>!S.slots.includes(p.id)); let k=0;
      for(let i=0;i<S.slots.length&&k<free.length;i++){ if(!S.slots[i]) S.slots[i]=free[k++].id; }
      save(); render(); break;
    }
    case 'clearGrid': S.slots=S.slots.map(()=>null); ui.sel=null; save(); render(); break;
    case 'clearAll':
      if(!askConfirm('clearAll')) break;
      S.photos=[]; S.slots=[]; ui.sel=null; ui.confirm=null;
      store.clear().catch(()=>{}); save(); render(); break;
    case 'start': {
      const order=S.slots.filter(Boolean);
      if(!order.length) break;
      S.order=order; S.runInterval=effInterval(); S.results=[]; S.savedIn=null; S.block=null;
      S.phase='running'; S.startAt=Date.now(); S.stoppedAt=null;
      audioUnlock(); cdKey=''; cdStartK=0; cdGoUntil=0;
      ui.sel=null; ui.editing=null; ui.copyText=null; ui.confirm=null;
      save(); render(); window.scrollTo(0,0); break;
    }
    case 'arrive': {
      const t=(down&&down.id===id&&Date.now()-down.t<2000)?down.t:Date.now();
      down=null; arrive(id,t); break;
    }
    case 'stop': S.phase='done'; S.stoppedAt=Date.now(); save(); render(); break;
    case 'resume': audioUnlock(); cdStartK=Math.floor((Date.now()-S.startAt)/((S.runInterval||1)*1000)); S.phase='running'; S.stoppedAt=null; save(); render(); break;
    case 'del': S.results=S.results.filter(r=>r.id!==el.dataset.rid); S.savedIn=null; save(); render(); break;
    case 'saveSheet': saveSheet(); break;
    case 'sound': soundOn=!soundOn; try{ localStorage.setItem(SOUND_KEY,soundOn?'1':'0'); }catch(e){} audioUnlock(); if(soundOn) beep(880,0.12,0.3); render(); break;
    case 'newSeason': ui.modal={type:'season',then:'new',focus:true}; render(); break;
    case 'closeModal': ui.modal=null; render(); break;
    case 'saveName': saveRename(ui.modal&&ui.modal.id,($('#modalInput')||{}).value); break;
    case 'pickToggle': {
      const a=ui.modal.chosen, k=a.indexOf(id);
      if(k>=0) a.splice(k,1); else a.push(id);
      render(); break;
    }
    case 'pickFree': {
      const a=ui.modal.chosen;
      S.photos.forEach(p=>{ if(!S.slots.includes(p.id)&&!a.includes(p.id)) a.push(p.id); });
      render(); break;
    }
    case 'pickDone': placeChosen(ui.modal.slot,ui.modal.chosen); ui.modal=null; save(); render(); break;
    case 'seasonOk': seasonOk(); break;
    case 'viewLast': openResults('control',0); break;
    case 'viewSummary': openResults('summary'); break;
    case 'viewCtl': ui.modal.type='control'; ui.modal.idx=+el.dataset.i; render(); break;
    case 'viewDist': ui.modal.dist=+el.dataset.v||0; render(); break;
    case 'reset':
      if(!askConfirm('reset')) break;
      S.phase='prep'; S.startAt=null; S.stoppedAt=null; S.order=[]; S.results=[]; S.day=today();
      ui.confirm=null; ui.copyText=null; save(); render(); window.scrollTo(0,0); break;
  }
}

/* ---------- Eventos ---------- */
app.addEventListener('pointerdown',e=>{
  if(S.phase==='running') audioUnlock();
  const el=e.target.closest('[data-act="arrive"]');
  if(el) down={id:el.dataset.id,t:Date.now()};
});
app.addEventListener('click',e=>{
  if(e.target.matches('input,select,textarea')) return;
  const el=e.target.closest('[data-act]');
  if(el) act(el.dataset.act,el,e);
});
app.addEventListener('keydown',e=>{
  const t=e.target;
  if(t.id==='modalInput'){
    if(e.key==='Enter'){e.preventDefault(); if(ui.modal.type==='rename') saveRename(ui.modal.id,t.value); else seasonOk();}
    else if(e.key==='Escape'){ui.modal=null; render();}
    return;
  }
  if(t.id==='renameInput'){
    if(e.key==='Enter'){e.preventDefault(); saveRename(t.dataset.id,t.value);}
    else if(e.key==='Escape'){ui.editing=null; render();}
    return;
  }
  if((e.key==='Enter'||e.key===' ')&&t.getAttribute('role')==='button'&&t.tagName==='DIV'){
    e.preventDefault(); act(t.dataset.act,t,e);
  }
});
app.addEventListener('focusout',e=>{
  const t=e.target;
  if(t.id==='renameInput'&&ui.editing===t.dataset.id) saveRename(t.dataset.id,t.value);
});
app.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='files'){const files=[...t.files]; t.value=''; addFiles(files); return;}
  if(t.id==='interval'){
    if(t.value==='custom') ui.customInterval=true;
    else{ S.interval=+t.value; ui.customInterval=false; }
    save(); render(); return;
  }
  if(t.id==='intervalCustom'){
    const v=Math.max(1,Math.min(600,Math.round(+t.value)||30));
    S.interval=v; if(PRESETS.includes(v)) ui.customInterval=false;
    save(); render(); return;
  }
  if(t.id==='day'){ S.day=t.value||today(); save(); render(); }
});

/* Arrastrar y soltar (ratón) */
app.addEventListener('dragstart',e=>{
  const t=e.target.closest('[data-drag]'); if(!t||S.phase!=='prep') return;
  e.dataTransfer.setData('text/plain',t.dataset.drag);
  e.dataTransfer.effectAllowed='move';
  t.classList.add('dragging');
});
app.addEventListener('dragend',()=>{
  document.querySelectorAll('.dragging,.over').forEach(x=>x.classList.remove('dragging','over'));
});
app.addEventListener('dragover',e=>{
  const z=e.target.closest('[data-slot],[data-pool]'); if(!z) return;
  e.preventDefault(); e.dataTransfer.dropEffect='move'; z.classList.add('over');
});
app.addEventListener('dragleave',e=>{
  const z=e.target.closest('[data-slot],[data-pool]');
  if(z&&!z.contains(e.relatedTarget)) z.classList.remove('over');
});
app.addEventListener('drop',e=>{
  const z=e.target.closest('[data-slot],[data-pool]'); if(!z) return;
  e.preventDefault(); e.stopPropagation();
  const files=e.dataTransfer.files;
  if(files&&files.length){addFiles(files);return;}
  const id=e.dataTransfer.getData('text/plain'); if(!id||!P(id)) return;
  if(z.hasAttribute('data-slot')) place(id,+z.dataset.slot); else unplace(id);
  ui.sel=null; save(); render();
});
/* Evita que soltar archivos fuera de la zona abra la foto en el navegador */
window.addEventListener('dragover',e=>{ if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')) e.preventDefault(); });
window.addEventListener('drop',e=>{
  if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){ e.preventDefault(); addFiles(e.dataTransfer.files); }
});

(async function boot(){
  app.innerHTML='<p class="foot">Cargando fotos guardadas…</p>';
  try{
    await store.init();
    let lib=[];
    try{ lib=await store.all(); }catch(e){ lib=[]; }
    const have=new Set(lib.map(p=>p.id));
    let k=Math.max(0,...lib.map(p=>p.ord||0));
    /* Fotos de la versión anterior, que estaban dentro del estado: se pasan a la biblioteca */
    for(const p of S.photos){
      if(p&&p.thumb&&!have.has(p.id)){ p.ord=++k; lib.push(p); try{ await store.put(p); }catch(e){} }
    }
    lib.sort((a,b)=>(a.ord||0)-(b.ord||0));
    ordN=Math.max(0,...lib.map(p=>p.ord||0));
    S.photos=lib;
  }catch(e){ S.photos=S.photos.filter(p=>p&&p.thumb); }
  save(); render();
})();
})();
</script>
