name: Compilar APK

on:
  push:
    branches: [main, master]
    # Cambios que solo afectan a la versión web (iPhone), a la documentación o a
    # los workflows no publican un APK nuevo.
    paths-ignore:
      - 'README.md'
      - '.github/**'
      - 'app/src/main/assets/sw.js'
      - 'app/src/main/assets/manifest.webmanifest'
      - 'app/src/main/assets/apple-touch-icon.png'
      - 'app/src/main/assets/icon-*.png'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Cronos.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Cronos-apk
          path: Cronos.apk

      - name: Publicar versión descargable
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Cronos 1.0.${{ github.run_number }}
          body: Descarga Cronos.apk desde el móvil e instálalo.
          files: Cronos.apk
          make_latest: true
