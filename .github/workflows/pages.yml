name: Publicar versión web (iPhone)

# La misma app, como web instalable desde Safari («Añadir a pantalla de inicio»).
# Se publica en GitHub Pages en cada cambio de la app en main.
on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/assets/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar la web
        run: |
          mkdir -p _site
          cp -r app/src/main/assets/. _site/
          # Cada publicación cambia la versión de la copia sin conexión
          sed -i "s/cronos-v1/cronos-${GITHUB_RUN_NUMBER}/" _site/sw.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
